services:
  panthers-agent:
    image: ghcr.io/mrgarbonzo/panthers-nft/agent:latest
    container_name: panthers-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3001:3001"
    volumes:
      - panthers_data:/data
    environment:
      - NODE_ENV=production
      - STORAGE_BACKEND=idiostasis
      - DB_PATH=/data/panthers.db
      - PUBLIC_CACHE_PATH=/data/public-cache.json
      - PUBLIC_PORT=8080
      - PAPER_TRADING=true
      - BASE_NETWORK=base-sepolia
      - SECRET_AI_BASE_URL=https://secretai-rytn.scrtlabs.com:21434
    env_file:
      - usr/.env

volumes:
  panthers_data:
    driver: local
